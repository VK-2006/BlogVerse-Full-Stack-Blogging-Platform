<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BlogVerse full-stack blogging platform" />
    <meta name="theme-color" content="#101828" />
    <title>BlogVerse — Ideas worth sharing</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("blogverse_theme");
          var theme = saved === "dark" || saved === "light"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#07111f" : "#f7f8fc");
        } catch (_) {}
      })();
    </script>
    <style>
      :root,[data-theme="light"]{color-scheme:light;--boot-page:#f7f8fc;--boot-surface:#fff;--boot-heading:#0f172a;--boot-text:#475569;--boot-track:#dbe2ea}
      [data-theme="dark"]{color-scheme:dark;--boot-page:#07111f;--boot-surface:#0f1b2d;--boot-heading:#fff;--boot-text:#cbd5e1;--boot-track:#2b3a4f}
      html,body,#root{min-height:100%;margin:0;background:var(--boot-page)}body{font-family:Arial,sans-serif;color:var(--boot-heading)}
      .boot-screen{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(109,74,255,.18),transparent 30%),radial-gradient(circle at 80% 75%,rgba(45,212,191,.15),transparent 32%),var(--boot-page)}
      .boot-card{text-align:center;color:var(--boot-heading)}.boot-logo{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:800;background:linear-gradient(135deg,#6d4aff,#7c3aed 58%,#14b8a6);box-shadow:0 20px 55px rgba(109,74,255,.28);animation:bootFloat 1.7s ease-in-out infinite}
      .boot-card strong{display:block;font-size:25px}.boot-card span{display:block;margin-top:7px;color:var(--boot-text);font-size:14px}.boot-line{width:190px;height:5px;margin:22px auto 0;border-radius:999px;overflow:hidden;background:var(--boot-track)}.boot-line i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6d4aff,#2dd4bf);animation:bootLoad 1.15s ease-in-out infinite}
      @keyframes bootFloat{50%{transform:translateY(-7px) rotate(2deg)}}@keyframes bootLoad{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
      @media(prefers-reduced-motion:reduce){.boot-logo,.boot-line i{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-logo">BV</div>
          <strong>BlogVerse</strong>
          <span>Preparing your stories...</span>
          <div class="boot-line"><i></i></div>
        </div>
      </div>
    </div>
    <noscript>JavaScript must be enabled to run BlogVerse.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
